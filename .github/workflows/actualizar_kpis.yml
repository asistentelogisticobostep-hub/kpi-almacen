name: Actualizar KPIs de Almacén

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# ESTO ES CLAVE: Evita que dos ejecuciones se pisen entre sí
concurrency:
  group: actualizar-kpis-almacen
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar librerías necesarias
        run: pip install -r requirements.txt

      - name: Ejecutar el script de KPIs
        env:
          SHEET_ID_ORIGINAL: ${{ secrets.SHEET_ID_ORIGINAL }}
          GID_ORIGINAL: ${{ secrets.GID_ORIGINAL }}
          SHEET_ID_DESTINO: ${{ secrets.SHEET_ID_DESTINO }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          # Agregado para que el script pueda avisar si falla (si lo configuraste)
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: python procesar_ventas.py
